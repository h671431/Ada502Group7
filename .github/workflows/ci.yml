name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    
    - name: Install uv
      run: pip install --upgrade uv
    
    - name: Sync dependencies
      run: uv sync
    
    - name: Run basic import check
      run: uv run python -c "from frcm import compute; print('✓ Imports successful')"
    
    - name: Test with example data
      run: uv run python -m frcm ./bergen_2026_01_09.csv
