name: Deploy Landing Page

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NREC_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.NREC_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy site to NREC
        run: |
          scp -i ~/.ssh/id_ed25519 -r site/* \
            ${{ secrets.NREC_USER }}@${{ secrets.NREC_HOST }}:/var/www/html/
