name: Deploy Landing Page

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NREC_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.NREC_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to NREC
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.NREC_USER }}@${{ secrets.NREC_HOST }} << 'EOF'
            cd ~/Ada502Group7 || git clone https://github.com/h671431/Ada502Group7.git
            cd Ada502Group7
            git pull
            sudo docker compose down
            sudo docker compose up --build -d
          EOF