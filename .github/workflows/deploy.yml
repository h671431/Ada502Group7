- name: Deploy to NREC
  run: |
    ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 ${{ secrets.NREC_USER }}@${{ secrets.NREC_HOST }} << 'EOF'
      set -euxo pipefail

      whoami
      pwd
      git --version
      docker --version || true
      docker-compose --version || true
      docker compose version || true

      if [ ! -d ~/Ada502Group7/.git ]; then
        git clone https://github.com/h671431/Ada502Group7.git ~/Ada502Group7
      fi

      cd ~/Ada502Group7
      git pull origin main

      docker-compose down || true
      docker-compose up --build -d
    EOF