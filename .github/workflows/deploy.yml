name: Deploy Landing Page

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH key
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.NREC_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.NREC_HOST }}" >> ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Test SSH connection
        shell: bash
        run: |
          set -euxo pipefail
          ssh -vvv -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 \
            "${{ secrets.NREC_USER }}@${{ secrets.NREC_HOST }}" \
            'echo "SSH OK"; whoami; hostname'

      - name: Test remote tools
        shell: bash
        run: |
          set -euxo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 \
            "${{ secrets.NREC_USER }}@${{ secrets.NREC_HOST }}" \
            'set -euxo pipefail; git --version; docker --version; docker compose version || docker-compose --version'

      - name: Deploy to NREC
        shell: bash
        run: |
          set -euxo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 \
            "${{ secrets.NREC_USER }}@${{ secrets.NREC_HOST }}" '
              set -euxo pipefail

              if [ ! -d "$HOME/Ada502Group7/.git" ]; then
                git clone https://github.com/h671431/Ada502Group7.git "$HOME/Ada502Group7"
              fi

              cd "$HOME/Ada502Group7"
              git pull origin main

              docker compose down || docker-compose down || true
              docker compose up --build -d || docker-compose up --build -d
            '